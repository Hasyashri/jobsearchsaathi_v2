version: "3.9"

services:
  backend:
    build: ./backend
    container_name: saathi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/data:/app/app/data       # catalog + role files
      - ./backend/app/storage:/app/app/storage  # feedback logs
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: saathi_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
